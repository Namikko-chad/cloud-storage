# Builds the binaries for a version tag (v1.2.3) and publishes a GitHub release
# with the matching CHANGELOG.md section as its notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libfuse-dev
      - run: make build build-windows VERSION=${GITHUB_REF_NAME#v}
      - name: Package
        run: |
          v=${GITHUB_REF_NAME}
          mkdir dist
          tar -C builds -czf dist/cloudsync-$v-linux-amd64.tar.gz cs cloudsyncd
          (cd builds/windows && zip -q ../../dist/cloudsync-$v-windows-amd64.zip cs.exe cloudsyncd.exe)
      - uses: actions/upload-artifact@v4
        with: { name: core, path: dist/ }

  linux-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
      - run: make build-linux VERSION=${GITHUB_REF_NAME#v} ENV=prod
      - run: mkdir dist && tar -C builds/linux -czf dist/cloudsync-app-${GITHUB_REF_NAME}-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: linux-app, path: dist/ }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key"
          fi
      - run: make build-apk VERSION=${GITHUB_REF_NAME#v} ENV=prod NDK=$ANDROID_NDK_LATEST_HOME
        env:
          CS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Package
        run: |
          mkdir dist
          cp builds/android/app-arm64-v8a-release.apk dist/cloudsync-${GITHUB_REF_NAME}-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/ }

  release:
    needs: [core, linux-app, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $v"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
