name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste passwords, tokens, vault files or storage credentials.
        Security problems: see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the Vault screen, or `cs status`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Linux, Windows, Android, CLI only]
    validations:
      required: true
  - type: input
    id: storages
    attributes:
      label: Storage types and k/m
      placeholder: "e.g. 2× Mega, S3, local; k=2 m=1"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Event log from the app or cloudsyncd.log (check that nothing secret is in it).
      render: text
