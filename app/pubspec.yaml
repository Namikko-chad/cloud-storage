name: cloudsync
description: CloudSync — encrypted file sync over several cloud storages, without a server.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  grpc: ^5.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  file_picker: ^10.0.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  open_filex: ^4.7.0
  intl: ^0.20.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/icon/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
